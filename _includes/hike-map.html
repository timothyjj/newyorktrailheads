    if (!trail) {
        document.getElementById('hikeMapContainer').innerHTML = '<p style="padding: 20px; color: red;">Error: Trail ID ' + trailId + ' not found</p>';
        return;
    }

    setTimeout(function() {
        const map = L.map('hikeMapContainer').setView([trail.lat, trail.lng], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        const trailType = Array.isArray(trail.type) ? trail.type[0] : trail.type;

        const iconColor = trailType === 'hiking' ? 'rgba(232, 121, 74, 0.9)' : 'rgba(50, 184, 198, 0.9)';
        const iconEmoji = trailType === 'hiking' ? '🥾' : '🚴';
        const icon = L.divIcon({
            html: '<div style="background: ' + iconColor + '; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 20px; border: 3px solid white; box-shadow: 0 2px 8px rgba(0,0,0,0.3);">' + iconEmoji + '</div>',
            iconSize: [40, 40],
            iconAnchor: [20, 20],
            popupAnchor: [0, -20]
        });

        let popupHTML = '<div class="hike-map-popup"><h3>' + trail.name + '</h3>';
        
        popupHTML += '<div class="coordinates" title="Click to copy">' + trail.lat + ', ' + trail.lng + '</div>';
        
        if (trail.links && trail.links.length > 0) {
            trail.links.forEach(function(link) {
                popupHTML += '<a href="' + link.url + '" target="_blank">' + link.text + ' →</a>';
            });
        }
        
        popupHTML += '</div>';

        const marker = L.marker([trail.lat, trail.lng], { icon: icon })
            .bindPopup(popupHTML)
            .addTo(map)
            .openPopup();

        // Add click-to-copy functionality for coordinates
        map.on('popupopen', function() {
            const coordElement = document.querySelector('.coordinates');
            if (coordElement) {
                coordElement.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const text = coordElement.textContent;
                    navigator.clipboard.writeText(text).then(function() {
                        const original = coordElement.textContent;
                        coordElement.textContent = 'Copied!';
                        setTimeout(function() {
                            coordElement.textContent = original;
                        }, 2000);
                    });
                });
            }
        });
    }, 100);
